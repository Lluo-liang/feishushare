<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书 OAuth 回调服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .status {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 12px;
            font-weight: 600;
            margin-top: 2rem;
        }

        .info-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
        }

        .info-section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .info-section p {
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .info-section code {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .logo {
                font-size: 3rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>飞书 OAuth 回调服务</h1>
        <p class="subtitle">
            这是一个专门用于处理飞书 OAuth 授权回调的中转服务<br>
            用于 Obsidian 飞书分享插件的授权流程
        </p>

        <div class="status">✓ 服务运行正常</div>

        <div class="info-section">
            <h2>工作原理</h2>
            <p>1. 用户在 Obsidian 中发起飞书授权</p>
            <p>2. 飞书授权完成后回调到此服务</p>
            <p>3. 此页面自动将授权信息传递回 Obsidian</p>
        </div>

        <div class="info-section">
            <h2>配置说明</h2>
            <p>在飞书开发者后台配置回调地址：</p>
            <p><code>https://your-domain.vercel.app/oauth-callback</code></p>
        </div>
    </div>
</body>
</html>
